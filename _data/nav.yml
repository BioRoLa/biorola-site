      color: blue
      pages:
        - { url: aboutus_introduction.html, label: { en: "Introduction", zh: "實驗室簡介" } }
        - { url: aboutus_labtour.html, label: { en: "Lab Tour", zh: "實驗室導覽" } }
        - { url: aboutus_honors.html, label: { en: "Honors", zh: "榮譽" } }
        - { url: aboutus_perspective.html, label: { en: "Prospective Students", zh: "招生資訊" } }
