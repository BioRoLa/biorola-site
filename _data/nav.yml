# Site navigation: drives the top menu and the hexagon sidebar.
#
# section -> groups (left column of hexagons) -> pages (right column).
# `url` is the file name only; Chinese pages are served at /<url>,
# English pages at /english/<url>. Colours are defined in assets/css/site.css.
# Sections with no `groups` link straight to their `url`.

- id: home
  label: { en: "Home", zh: "首頁" }
  url: index.html

- id: news
  label: { en: "News", zh: "最新消息" }
  url: news.html
  groups:
    - label: { en: "News", zh: "最新消息" }
      color: green
      pages:
        - { url: news.html, label: { en: "News", zh: "最新消息" } }

- id: about
  label: { en: "About Us", zh: "關於我們" }
  groups:
