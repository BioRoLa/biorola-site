research_spherical_omnicron.html:
- name: "Omnicron"
  years: "2011 – now"
  photo: "/pic/photo/robots/Omnicron.jpg"
  en: |
    Omnicron is a spherical robot with singularity-free omnidirectional locomotion ability. Instead of using a single driven ball as in its predessor OmniQiu, the robot utilizes three omnidirectional wheels to drive its spherical shell. Three wheels are controlled independently, thus achieving 3-DOF planar locomotion by simple 3 to 3 mapping.
research_spherical_omniqiu.html:
- name: "OmniQiu"
  years: "2010 – 2013"
  photo: "/pic/photo/robots/Figure 09.jpg"
  en: |
    OmniQue is a novel omnidirectional spherical robot. Instead of using wheels or flywheels as driving mechanism, the robot uses two orthogonally-mounted rollers to drive a ball installed inside a spherical shell. Because the ball rolls on the shell, the robot performs omnidirectional and singularity-free locomotion.
