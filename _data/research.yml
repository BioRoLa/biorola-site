research_spherical_omnicron.html:
- name: "Omnicron"
  years: "2011 – now"
  photo: "/pic/photo/robots/Omnicron.jpg"
  en: |
    Omnicron is a spherical robot with singularity-free omnidirectional locomotion ability. Instead of using a single driven ball as in its predecessor OmniQiu, the robot utilizes three omnidirectional wheels to drive its spherical shell. Three wheels are controlled independently, thus achieving 3-DOF planar locomotion by simple 3 to 3 mapping.
  zh: |
    Omnicron 是一台具備無奇異點全向移動能力的球形機器人。有別於其前身 OmniQiu 以單一被驅動的球作為驅動方式，Omnicron 使用三個全向輪驅動球形外殼。三個輪子各自獨立控制，透過簡單的三對三映射即可達成三自由度的平面運動。
research_spherical_omniqiu.html:
- name: "OmniQiu"
  years: "2010 – 2013"
  photo: "/pic/photo/robots/Figure 09.jpg"
  en: |
    OmniQiu is a novel omnidirectional spherical robot. Instead of using wheels or flywheels as driving mechanism, the robot uses two orthogonally-mounted rollers to drive a ball installed inside a spherical shell. Because the ball rolls on the shell, the robot performs omnidirectional and singularity-free locomotion.
  zh: |
    OmniQiu 是一台新型的全向球形機器人。它不以輪子或飛輪作為驅動機構，而是以兩個正交安裝的滾輪，驅動裝在球形外殼內的一顆球。由於這顆球在外殼上滾動，機器人得以進行全向且無奇異點的運動。
